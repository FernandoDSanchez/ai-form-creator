worker_processes auto;

# The pod runs with readOnlyRootFilesystem: the only writable places are the
# emptyDirs mounted on /tmp and /var/cache/nginx. Everything nginx wants to
# write has to land there — hence the pid and the *_temp_path below.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout combined;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  sendfile    on;
  tcp_nopush  on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    # 8080 and not 80: the container runs as non-root and ports < 1024 need
    # CAP_NET_BIND_SERVICE, which the Deployment drops.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite assets carry a hash in their name, so they are immutable.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # index.html is NOT cached: it is what points at the hashed assets. If it
    # is cached, a new deploy keeps serving the old bundle.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # SPA: react-router resolves the routes on the client, so any unknown path
    # returns index.html instead of a 404.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
