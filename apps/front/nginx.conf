worker_processes auto;

# El pod corre con readOnlyRootFilesystem: lo único escribible son los emptyDir
# montados en /tmp y /var/cache/nginx. Todo lo que nginx quiera escribir tiene
# que caer ahí — de ahí el pid y los *_temp_path de abajo.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout combined;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  sendfile    on;
  tcp_nopush  on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    # 8080 y no 80: el contenedor corre como no-root y los puertos < 1024
    # necesitan CAP_NET_BIND_SERVICE, que el Deployment dropea.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los assets de Vite llevan hash en el nombre, así que son inmutables.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # index.html NO se cachea: es quien apunta a los assets hasheados. Si se
    # cachea, un deploy nuevo sigue sirviendo el bundle viejo.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # SPA: react-router resuelve las rutas en el cliente, así que cualquier
    # path desconocido devuelve index.html en vez de 404.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
