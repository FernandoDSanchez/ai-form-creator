apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Elasticsearch 8 — generic reusable search / vector store component
#
# Resources: StatefulSet (elasticsearch), Service (elasticsearch)
#
# Single-node, security enabled, TLS disabled (in-cluster traffic only).
# `discovery.type=single-node` also skips the bootstrap checks, so no
# privileged initContainer is needed to raise vm.max_map_count.
#
# Tenant overlay must provide real credentials via:
#   - SealedSecret replacing elasticsearch-secret, OR
#   - secretGenerator in overlay
# with key: ELASTIC_PASSWORD
#
# To run multiple instances in the same namespace, use namePrefix
# in an intermediate kustomization:
#   resources:
#     - path/to/databases/elasticsearch
#   namePrefix: myapp-
#   → produces: myapp-elasticsearch (StatefulSet, Service)
#
# Sizing: defaults to a 1Gi JVM heap inside a 4Gi limit and a 20Gi PVC.
# Patch ES_JAVA_OPTS and the volumeClaimTemplate for anything beyond a lab.

resources:
  # - secret.yaml # Tenant overlay must provide real credentials (SealedSecret, secretGenerator, etc.)
  - service.yaml
  - statefulset.yaml

labels:
  - pairs:
      app.kubernetes.io/ait-component: elasticsearch
