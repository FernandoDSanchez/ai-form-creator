apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ai-form-creator — infrastructure root (forjate remote pattern)
#
# The factory is consumed pinned to an immutable commit. Do NOT use v1.0.0:
# that tag predates the decoupling and brings Longhorn, LiteLLM and Open WebUI
# baked into the base, with no way of taking them as opt-in components.
#
# It has to be the FULL SHA (40 chars) or a tag: `git fetch` does not resolve
# short SHAs and kustomize fails with "couldn't find remote ref".
#
# To bump the version, change the ref in every file in one go:
#   OLD=$(grep -rho 'ref=[0-9a-f]\{40\}' iac/ | head -1 | cut -d= -f2)
#   grep -rl "$OLD" iac/ | xargs sed -i "s/$OLD/<new-ref>/g"
#
# The base contributes: namespaces (cert-manager, security, traefik, ai-tools)
# and the MinIO operator. The MinIO Tenant is instantiated here because its
# kustomization pins `namespace: minio-operator`.
#
# ⚠️ DO NOT APPLY THIS ROOT ON A CLUSTER THAT ALREADY HAS THE FORJATE BASE
# installed by another project. The `labels:` block below is stamped over
# EVERYTHING it builds, base included: it rewrites `part-of` on the shared
# namespaces, on traefik, on the MinIO operator and on the CRDs, and it deletes
# the original owner's `app.kubernetes.io/overlay`. Check first with:
#   kustomize build iac/k8s/ | kubectl diff -f -
# If the base is already in place, apply only ./namespaces/ai-form-creator (and
# the MinIO Tenant on its own, if you are missing it).

resources:
  # --- factory ---
  - https://github.com/AItizate/forjate.git//k8s/base?ref=7ac17e6a07446969b2b12004f694e09aa134642e
  - https://github.com/AItizate/forjate.git//k8s/components/apps/minio/single-server?ref=7ac17e6a07446969b2b12004f694e09aa134642e

  # --- our own namespace ---
  # All of ai-form-creator lives in a single namespace. See
  # namespaces/ai-form-creator/.
  - ./namespaces/ai-form-creator

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: ai-form-creator
