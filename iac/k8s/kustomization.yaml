apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ai-form-creator — raíz de infraestructura (patrón remoto de forjate)
#
# La factory se consume pineada a un commit inmutable. NO uses v1.0.0: ese tag
# es anterior al desacople y trae Longhorn, LiteLLM y Open WebUI metidos dentro
# del base, sin posibilidad de tomarlos como componentes opt-in.
#
# Tiene que ser el SHA COMPLETO (40 chars) o un tag: `git fetch` no resuelve
# SHAs cortos y kustomize falla con "couldn't find remote ref".
#
# Para subir de versión, cambiá la ref en todos los archivos de una sola vez:
#   OLD=$(grep -rho 'ref=[0-9a-f]\{40\}' iac/ | head -1 | cut -d= -f2)
#   grep -rl "$OLD" iac/ | xargs sed -i "s/$OLD/<nueva-ref>/g"
#
# El base aporta: namespaces (cert-manager, security, traefik, ai-tools) y el
# operador de MinIO. El Tenant de MinIO se instancia acá porque su
# kustomization fija `namespace: minio-operator`.
#
# ⚠️ NO APLIQUES ESTA RAÍZ SOBRE UN CLUSTER QUE YA TENGA LA BASE DE FORJATE
# instalada por otro proyecto. El bloque `labels:` de abajo se estampa sobre
# TODO lo que buildea, base incluida: le reescribe `part-of` a los namespaces
# compartidos, a traefik, al operador de MinIO y a los CRDs, y les borra el
# `app.kubernetes.io/overlay` del dueño original. Verificalo antes con:
#   kustomize build iac/k8s/ | kubectl diff -f -
# Si la base ya está puesta, aplicá sólo ./namespaces/ai-form-creator (y el
# Tenant de MinIO suelto, si te falta).

resources:
  # --- factory ---
  - https://github.com/AItizate/forjate.git//k8s/base?ref=7ac17e6a07446969b2b12004f694e09aa134642e
  - https://github.com/AItizate/forjate.git//k8s/components/apps/minio/single-server?ref=7ac17e6a07446969b2b12004f694e09aa134642e

  # --- namespace propio ---
  # Todo ai-form-creator vive en un solo namespace. Ver namespaces/ai-form-creator/.
  - ./namespaces/ai-form-creator

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: ai-form-creator
