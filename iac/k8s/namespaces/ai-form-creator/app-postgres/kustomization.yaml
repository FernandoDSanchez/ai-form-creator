apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Envuelve el componente genérico de postgres con el prefijo app-.
# Produce: app-postgres (StatefulSet, Service) + su PVC app-postgres-storage.
#
# POR QUÉ EXISTE: en un namespace único conviven dos Postgres — éste y el que
# trae el bundle temporal-stack. Los dos salen del mismo componente genérico,
# así que sin prefijo colisionan en StatefulSet/Service/Secret `postgres` y el
# Service terminaría balanceando contra los pods del otro.
#
# Se prefija ÉSTE y no el de Temporal a propósito: el de Temporal vive dentro
# del bundle remoto y renombrarlo obligaría a parchear `POSTGRES_SEEDS` y dos
# `secretKeyRef` adentro del bundle. Éste lo referenciamos nosotros, así que
# alcanza con envolverlo acá.
#
# El overlay debe proveer el Secret `app-postgres-secret`.

resources:
  - https://github.com/AItizate/forjate.git//k8s/components/apps/databases/postgres?ref=7ac17e6a07446969b2b12004f694e09aa134642e

namePrefix: app-

patches:
  # namePrefix no se propaga al secretRef cuando el Secret no está en este
  # build (lo genera el overlay padre), así que lo apuntamos explícito.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: app-postgres-secret
  # namePrefix renombra recursos pero deja la label `app` intacta: el Postgres
  # de Temporal, con la misma label, quedaría detrás de este Service. Se
  # renombra la label de los dos lados para mantenerlos separados.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: app-postgres
      - op: replace
        path: /spec/template/metadata/labels/app
        value: app-postgres
  - target:
      kind: Service
      name: postgres
    patch: |-
      - op: replace
        path: /spec/selector/app
        value: app-postgres
