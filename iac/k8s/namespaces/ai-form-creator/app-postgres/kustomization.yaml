apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Wraps the generic postgres component with the app- prefix.
# It produces: app-postgres (StatefulSet, Service) + its app-postgres-storage
# PVC.
#
# WHY IT EXISTS: in a single namespace two Postgres instances coexist — this
# one and the one the temporal-stack bundle brings. Both come from the same
# generic component, so without a prefix they collide on the `postgres`
# StatefulSet/Service/Secret and the Service would end up balancing against the
# other one's pods.
#
# THIS one is prefixed and not Temporal's on purpose: Temporal's lives inside
# the remote bundle and renaming it would force patching `POSTGRES_SEEDS` and
# two `secretKeyRef` inside the bundle. This one we reference ourselves, so
# wrapping it here is enough.
#
# The overlay must provide the `app-postgres-secret` Secret.

resources:
  - https://github.com/AItizate/forjate.git//k8s/components/apps/databases/postgres?ref=7ac17e6a07446969b2b12004f694e09aa134642e

namePrefix: app-

patches:
  # namePrefix does not propagate to the secretRef when the Secret is not in
  # this build (the parent overlay generates it), so we point at it
  # explicitly.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: app-postgres-secret
  # namePrefix renames resources but leaves the `app` label intact: Temporal's
  # Postgres, carrying the same label, would end up behind this Service. The
  # label is renamed on both sides to keep them apart.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: app-postgres
      - op: replace
        path: /spec/template/metadata/labels/app
        value: app-postgres
  - target:
      kind: Service
      name: postgres
    patch: |-
      - op: replace
        path: /spec/selector/app
        value: app-postgres
