apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      # Migrations run before the app, not from the app: with 2 replicas two
      # processes would migrate at once. Prisma takes an advisory lock, so the
      # second initContainer waits for the first instead of clashing.
      initContainers:
        - name: migrate
          image: ai-form-creator/back
          # The image is imported by hand into the k3s containerd; there is no
          # registry to pull it from. See the `images` block of the
          # kustomization.
          imagePullPolicy: IfNotPresent
          command:
            ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          env:
            # The Prisma CLI writes a cache into $HOME; the rootfs is
            # read-only and /tmp is the only emptyDir mounted.
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: back-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: back
          # NestJS + Prisma. The wiring to Postgres / RAGFlow comes from
          # back-config (non-secret) and back-secret (DATABASE_URL, API keys).
          image: ai-form-creator/back
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: back-config
            - secretRef:
                name: back-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
