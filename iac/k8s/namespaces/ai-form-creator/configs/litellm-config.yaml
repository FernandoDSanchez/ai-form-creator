model_list:
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: "openai/*"
    litellm_params:
      model: openai/*
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "gemini/*"
    litellm_params:
      model: gemini/*
      api_key: os.environ/GEMINI_API_KEY

# RAGFlow y el backend hablan con LiteLLM, no con los proveedores. Eso deja
# todas las credenciales de modelos en un solo Secret (litellm-secret) y
# permite cambiar de proveedor sin tocar las apps.
