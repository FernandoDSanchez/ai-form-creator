apiVersion: v1
kind: ConfigMap
metadata:
  name: ragflow-service-conf
data:
  # Wires RAGFlow → LiteLLM. The only thing specific to this overlay is the
  # `user_default_llm` block at the end; everything above is a literal copy of
  # the vendored component.
  #
  # WHY THE WHOLE TEMPLATE IS REWRITTEN: the value of a ConfigMap key is an
  # opaque string. Kustomize cannot insert "one more block" inside it; a patch
  # over `service_conf.yaml.template` replaces the whole file. When moving
  # RAGFlow into the factory (or bumping the component), re-diff:
  #   diff <(yq '.data["service_conf.yaml.template"]' \
  #             ../../components/apps/rag/ragflow/service-conf.yaml) \
  #        <(yq '.data["service_conf.yaml.template"]' \
  #             patches/ragflow-litellm-patch.yaml)
  # and expect exactly the user_default_llm block as the only difference.
  service_conf.yaml.template: |
    ragflow:
      host: ${RAGFLOW_HOST:-0.0.0.0}
      http_port: 9380
    admin:
      host: ${RAGFLOW_HOST:-0.0.0.0}
      http_port: 9381
    mysql:
      name: '${MYSQL_DBNAME:-rag_flow}'
      user: '${MYSQL_USER:-root}'
      password: '${MYSQL_PASSWORD}'
      host: '${MYSQL_HOST:-ragflow-mysql}'
      port: ${MYSQL_PORT:-3306}
      max_connections: 900
      stale_timeout: 300
      max_allowed_packet: ${MYSQL_MAX_PACKET:-1073741824}
    minio:
      user: '${MINIO_USER}'
      password: '${MINIO_PASSWORD}'
      host: '${MINIO_HOST}:${MINIO_PORT}'
      bucket: '${MINIO_BUCKET:-}'
      prefix_path: '${MINIO_PREFIX_PATH:-}'
    es:
      hosts: 'http://${ES_HOST:-ragflow-elasticsearch}:${ES_PORT:-9200}'
      username: '${ES_USER:-elastic}'
      password: '${ELASTIC_PASSWORD}'
    redis:
      db: 1
      username: '${REDIS_USERNAME:-}'
      password: '${REDIS_PASSWORD}'
      host: '${REDIS_HOST:-ragflow-redis}:${REDIS_PORT:-6379}'
    # --- LiteLLM ------------------------------------------------------------
    # RAGFlow does not talk to Anthropic/OpenAI/Gemini: it talks to the proxy,
    # which exposes the OpenAI API. That way the provider keys live only in
    # litellm-secret and switching models is changing a name here.
    #
    # MIND WHEN EDITING: the entrypoint passes every line of this template
    # through 'eval echo', comments included. No backticks, no double quotes, no
    # backslash and no dollar sign that is not a variable to expand: the shell
    # re-evaluates them and breaks the startup.
    #
    # factory: 'OpenAI-API-Compatible' is the exact name RAGFlow looks for in
    # conf/llm_factories.json. It has to match verbatim.
    #
    # name: is the LiteLLM route -- provider/model -- the one matched by the
    # wildcards in configs/litellm-config.yaml. Today it points at Gemini
    # because it is the only provider with a key loaded in litellm.env; to move
    # the default to Claude, anthropic/claude-sonnet-4-5 plus its
    # ANTHROPIC_API_KEY is enough.
    #
    # base_url WITHOUT a trailing slash, on purpose: the chat client uses it
    # as-is and the embeddings one urljoins 'v1' onto it -- with /v1/ it would
    # end up hitting /v1/v1.
    #
    # api_key comes from ragflow-secret through envFrom: the entrypoint expands
    # this template against the process environment. Empty, RAGFlow starts all
    # the same and the model only fails when invoked.
    user_default_llm:
      factory: 'OpenAI-API-Compatible'
      api_key: '${LITELLM_API_KEY}'
      base_url: 'http://litellm:4000/v1'
      default_models:
        chat_model:
          name: 'gemini/gemini-flash-latest'
        embedding_model:
          name: 'gemini/gemini-embedding-001'
