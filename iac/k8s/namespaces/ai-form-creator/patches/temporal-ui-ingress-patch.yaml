apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-ui-ingress
spec:
  rules:
    - host: "temporal.192.168.18.23.nip.io" # nip.io → IP del nodo; ver ingress.yaml
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal-ui-svc
                port:
                  number: 8080
